name: KiCad 10.0.8 native toolchain verification

on:
  workflow_dispatch:
  push:
    branches:
      - feat/kicad10-patch-capability-gates
    paths:
      - development/native_verify_kicad_1008.py
      - development/fixtures/npi-demo/**
      - kicad-pcb-ai-workflow/**
      - .github/workflows/native-kicad-10.0.8.yml

permissions:
  contents: read

jobs:
  native-kicad-1008:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DEBIAN_FRONTEND: noninteractive
      KICAD_NATIVE_REPORT: /tmp/native-kicad-1008.json
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Install official KiCad 10 stable PPA
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update -qq
          apt-cache policy kicad
          sudo apt-get install -y --no-install-recommends kicad kicad-demos xvfb
      - name: Inspect real native versions
        run: |
          kicad-cli version
          /usr/bin/python3 -c 'import pcbnew; print("pcbnew", pcbnew.GetBuildVersion())'
      - name: Execute isolated, fail-closed native integration checks
        run: /usr/bin/python3 development/native_verify_kicad_1008.py
      - name: Upload native toolchain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kicad-10.0.8-native-evidence
          path: /tmp/native-kicad-1008.json
          if-no-files-found: warn
          retention-days: 30
