name: Workflow software checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  software:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema validation dependency
        run: python -m pip install -r requirements.txt
      - name: Test software contracts and package isolation
        run: python -B -m unittest discover -s development/tests -v
      - name: R10 cache and Konnect migration software regressions
        run: python -B -m unittest discover -s development/r10_tests -v
      - name: Validate standalone Skill and preview distribution
        run: python -B development/build_release.py --output-dir /tmp/kicad-release-preview
  native-led-case:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
      DEBIAN_FRONTEND: noninteractive
      KICAD10_FOOTPRINT_DIR: /usr/share/kicad/footprints
      KICAD10_SYMBOL_DIR: /usr/share/kicad/symbols
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned development parsers
        run: python -m pip install -r development/requirements-led-validation.txt
      - name: Install real KiCad and standard libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends kicad kicad-footprints kicad-symbols
          test "$(kicad-cli version)" = "10.0.8"
          mkdir -p "$HOME/.config/kicad/10.0"
          cp /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/10.0/fp-lib-table"
          cp /usr/share/kicad/template/sym-lib-table "$HOME/.config/kicad/10.0/sym-lib-table"
      - name: Revalidate saved LED case with native zero-warning checks and actual exports
        run: python -B development/native_led_8x8_e2e.py --output /tmp/native-led-case
      - name: Verify exact public companion source can be prepared
        run: python -B development/konnect-field-extension/prepare.py --destination /tmp/konnect-fields-source
      - name: Preserve scoped native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-led-case-evidence
          path: /tmp/native-led-case/
          if-no-files-found: warn
          retention-days: 90
