name: Workflow software checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test software contracts and package isolation
        run: python -B -m unittest discover -s development/tests -v
      - name: Validate standalone Skill and preview distribution
        run: python -B development/build_release.py --output-dir /tmp/kicad-release-preview
