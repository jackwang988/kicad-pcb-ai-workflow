<svg xmlns="http://www.w3.org/2000/svg" width="1670" height="1060" viewBox="0 0 1670 1060" role="img" aria-label="KiCad PCB AI Skill R10 系统流程图"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071329"/><stop offset="0.65" stop-color="#0c2243"/><stop offset="1" stop-color="#041123"/></linearGradient><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#69cfff"/></marker><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#f4f9ff} .muted{fill:#aac0da}.head{font-size:36px;font-weight:750}.sub{font-size:17px;fill:#b2c8e7}.group{font-size:22px;font-weight:700}.step{font-size:18px;font-weight:700}.sm{font-size:15px}.tiny{font-size:13px}</style></defs><rect width="100%" height="100%" fill="url(#bg)"/><path d="M0 95 H1670" stroke="#2e658e" opacity=".5"/><path d="M25 1020 H1645" stroke="#2e658e" opacity=".4"/><text x="835" y="61" text-anchor="middle" class="head">R10 · Konnect动态工具与单写入执行闭环</text><text x="835" y="89" text-anchor="middle" class="sub">全部工具可发现 · 按风险验收 · 记录可复用 · 项目操作仍独立验证</text><rect x="515" y="118" width="640" height="89" rx="15" fill="#37b9ff" fill-opacity=".09" stroke="#37b9ff" stroke-width="2"/><text x="835" y="149" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">当前项目EDA操作任务</text><text x="835" y="175" text-anchor="middle" font-size="15" class="muted">定位工程/版本、识别读写目标与保护对象</text><line x1="835" y1="207" x2="835" y2="243" stroke="#69cfff" stroke-width="2.7" marker-end="url(#arr)" /><rect x="515" y="247" width="640" height="87" rx="15" fill="#b49bff" fill-opacity=".09" stroke="#b49bff" stroke-width="2"/><text x="835" y="278" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">动态发现全部Konnect工具</text><text x="835" y="304" text-anchor="middle" font-size="15" class="muted">不锁死228/235数量，实时读取名称、Schema与构建版本</text><line x1="835" y1="334" x2="835" y2="366" stroke="#69cfff" stroke-width="2.7" marker-end="url(#arr)" /><rect x="515" y="370" width="640" height="77" rx="15" fill="#37b9ff" fill-opacity=".09" stroke="#37b9ff" stroke-width="2"/><text x="835" y="401" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">风险分级：L0 / L1 / L2 / L3</text><text x="835" y="427" text-anchor="middle" font-size="15" class="muted">只读 / 常规可回退编辑 / 受控布线 / 高风险重构</text><line x1="740" y1="447" x2="480" y2="496" stroke="#69cfff" stroke-width="2.7" marker-end="url(#arr)" /><line x1="930" y1="447" x2="1190" y2="496" stroke="#69cfff" stroke-width="2.7" marker-end="url(#arr)" /><rect x="80" y="501" width="640" height="119" rx="15" fill="#38e2ad" fill-opacity=".09" stroke="#38e2ad" stroke-width="2"/><text x="400" y="532" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">已有有效的能力验收记录</text><text x="400" y="558" text-anchor="middle" font-size="15" class="muted">匹配Konnect/KiCad版本、工具Schema</text><text x="400" y="579" text-anchor="middle" font-size="15" class="muted">操作对象和适用参数范围</text><rect x="950" y="501" width="640" height="119" rx="15" fill="#ffb45e" fill-opacity=".09" stroke="#ffb45e" stroke-width="2"/><text x="1270" y="532" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">首次使用或验收失效</text><text x="1270" y="558" text-anchor="middle" font-size="15" class="muted">先在独立候选中执行代表性操作</text><text x="1270" y="579" text-anchor="middle" font-size="15" class="muted">检查保存/重载、异常恢复与原生DRC</text><line x1="1270" y1="620" x2="1270" y2="673" stroke="#69cfff" stroke-width="2.7" marker-end="url(#arr)" /><rect x="950" y="681" width="640" height="75" rx="15" fill="#ffb45e" fill-opacity=".09" stroke="#ffb45e" stroke-width="2"/><text x="1270" y="712" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">成功：登记能力证据/失败：BLOCKED</text><text x="1270" y="738" text-anchor="middle" font-size="14" class="muted">证据哈希变化或版本变化时重新验收</text><line x1="400" y1="620" x2="400" y2="798" stroke="#69cfff" stroke-width="2.7" marker-end="url(#arr)" /><line x1="950" y1="718" x2="700" y2="798" stroke="#69cfff" stroke-width="2.7" marker-end="url(#arr)" /><rect x="470" y="806" width="730" height="85" rx="15" fill="#b49bff" fill-opacity=".09" stroke="#b49bff" stroke-width="2"/><text x="835" y="837" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Konnect MCP唯一活动工程写入者</text><text x="835" y="863" text-anchor="middle" font-size="15" class="muted">分批编辑真实候选、按UUID/坐标/网络回读</text><line x1="835" y1="891" x2="835" y2="924" stroke="#69cfff" stroke-width="2.7" marker-end="url(#arr)" /><rect x="470" y="927" width="730" height="84" rx="15" fill="#38e2ad" fill-opacity=".09" stroke="#38e2ad" stroke-width="2"/><text x="835" y="958" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">保存重载 → KiCad原生ERC/DRC → 项目门禁</text><text x="835" y="984" text-anchor="middle" font-size="15" class="muted">风险未关闭返回修复；通过后进入下个节点</text></svg>