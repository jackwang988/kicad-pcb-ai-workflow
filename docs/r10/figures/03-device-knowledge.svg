<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1030" viewBox="0 0 1600 1030" role="img" aria-label="KiCad PCB AI Skill R10 系统流程图"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071329"/><stop offset="0.65" stop-color="#0c2243"/><stop offset="1" stop-color="#041123"/></linearGradient><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#69cfff"/></marker><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#f4f9ff} .muted{fill:#aac0da}.head{font-size:36px;font-weight:750}.sub{font-size:17px;fill:#b2c8e7}.group{font-size:22px;font-weight:700}.step{font-size:18px;font-weight:700}.sm{font-size:15px}.tiny{font-size:13px}</style></defs><rect width="100%" height="100%" fill="url(#bg)"/><path d="M0 95 H1600" stroke="#2e658e" opacity=".5"/><path d="M25 990 H1575" stroke="#2e658e" opacity=".4"/><text x="800" y="61" text-anchor="middle" class="head">R10 · 原厂芯片知识库跨项目与G1–G4复用</text><text x="800" y="89" text-anchor="middle" class="sub">节点3缓存优先 · 来源/版本/适用性校验 · 每个实际工程独立复验</text><rect x="520" y="118" width="560" height="90" rx="15" fill="#37b9ff" fill-opacity=".09" stroke="#37b9ff" stroke-width="2"/><text x="800" y="149" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">输入：精确Manufacturer + MPN + Package</text><text x="800" y="175" text-anchor="middle" font-size="15" class="muted">新项目需求、当前工作模式与原厂资料要求</text><line x1="800" y1="208" x2="800" y2="239" stroke="#69cfff" stroke-width="2.7" marker-end="url(#arr)" /><rect x="520" y="246" width="560" height="84" rx="15" fill="#38e2ad" fill-opacity=".09" stroke="#38e2ad" stroke-width="2"/><text x="800" y="277" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">先查共享知识库</text><text x="800" y="303" text-anchor="middle" font-size="15" class="muted">已审核卡片、原厂文档修订与SHA-256</text><line x1="710" y1="330" x2="380" y2="380" stroke="#69cfff" stroke-width="2.7" marker-end="url(#arr)" /><text x="553" y="347" font-size="14" fill="#b5d9f5">缺失/过期</text><line x1="900" y1="330" x2="1200" y2="380" stroke="#69cfff" stroke-width="2.7" marker-end="url(#arr)" /><text x="1058" y="347" font-size="14" fill="#b5d9f5">命中有效</text><rect x="70" y="388" width="590" height="113" rx="15" fill="#ffb45e" fill-opacity=".09" stroke="#ffb45e" stroke-width="2"/><text x="365" y="419" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">节点3补资料 → 提炼知识卡 → 人工核对</text><text x="365" y="445" text-anchor="middle" font-size="15" class="muted">仅补齐缺失内容，保留原厂章节与版本</text><text x="365" y="466" text-anchor="middle" font-size="15" class="muted">核对成功后注册共享知识库</text><rect x="935" y="388" width="580" height="113" rx="15" fill="#38e2ad" fill-opacity=".09" stroke="#38e2ad" stroke-width="2"/><text x="1225" y="419" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">复用已审核知识卡</text><text x="1225" y="445" text-anchor="middle" font-size="15" class="muted">不重复下载同一份手册</text><text x="1225" y="466" text-anchor="middle" font-size="15" class="muted">按需读取本阶段条目以节省Token</text><line x1="365" y1="501" x2="365" y2="546" stroke="#69cfff" stroke-width="2.7" marker-end="url(#arr)" /><line x1="1225" y1="501" x2="1225" y2="546" stroke="#69cfff" stroke-width="2.7" marker-end="url(#arr)" /><rect x="450" y="549" width="700" height="82" rx="15" fill="#38e2ad" fill-opacity=".09" stroke="#38e2ad" stroke-width="2"/><text x="800" y="580" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">冻结当前项目所用器件知识</text><text x="800" y="606" text-anchor="middle" font-size="15" class="muted">精确型号/封装/来源/哈希，跨阶段一致</text><rect x="65" y="710" width="345" height="124" rx="15" fill="#37b9ff" fill-opacity=".09" stroke="#37b9ff" stroke-width="2"/><text x="237.5" y="741" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">G1 · 节点06</text><text x="237.5" y="767" text-anchor="middle" font-size="15" class="muted">原理图与外围电路</text><text x="237.5" y="788" text-anchor="middle" font-size="15" class="muted">电源/复位/启动/时钟</text><line x1="800" y1="631" x2="237" y2="701" stroke="#69cfff" stroke-width="2.7" marker-end="url(#arr)" /><rect x="460" y="710" width="345" height="124" rx="15" fill="#38e2ad" fill-opacity=".09" stroke="#38e2ad" stroke-width="2"/><text x="632.5" y="741" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">G2 · 节点07</text><text x="632.5" y="767" text-anchor="middle" font-size="15" class="muted">符号/封装/引脚映射</text><text x="632.5" y="788" text-anchor="middle" font-size="15" class="muted">Pinout/Land Pattern</text><line x1="800" y1="631" x2="632" y2="701" stroke="#69cfff" stroke-width="2.7" marker-end="url(#arr)" /><rect x="855" y="710" width="345" height="124" rx="15" fill="#b49bff" fill-opacity=".09" stroke="#b49bff" stroke-width="2"/><text x="1027.5" y="741" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">G3 · 节点09</text><text x="1027.5" y="767" text-anchor="middle" font-size="15" class="muted">去耦/晶振/RF</text><text x="1027.5" y="788" text-anchor="middle" font-size="15" class="muted">布局与局部回路</text><line x1="800" y1="631" x2="1027" y2="701" stroke="#69cfff" stroke-width="2.7" marker-end="url(#arr)" /><rect x="1250" y="710" width="345" height="124" rx="15" fill="#ffb45e" fill-opacity=".09" stroke="#ffb45e" stroke-width="2"/><text x="1422.5" y="741" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">G4 · 节点11</text><text x="1422.5" y="767" text-anchor="middle" font-size="15" class="muted">铜层/差分/回流</text><text x="1422.5" y="788" text-anchor="middle" font-size="15" class="muted">最终PCB实际评审</text><line x1="800" y1="631" x2="1422" y2="701" stroke="#69cfff" stroke-width="2.7" marker-end="url(#arr)" /><line x1="800" y1="837" x2="800" y2="881" stroke="#69cfff" stroke-width="2.7" marker-end="url(#arr)" /><rect x="470" y="884" width="660" height="86" rx="15" fill="#ffb45e" fill-opacity=".09" stroke="#ffb45e" stroke-width="2"/><text x="800" y="915" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">当前项目独立验证</text><text x="800" y="941" text-anchor="middle" font-size="15" class="muted">原生ERC/DRC + Python审计 + AI评审 + 工程师签核</text></svg>