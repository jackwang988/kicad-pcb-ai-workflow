<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1560" viewBox="0 0 1800 1560" role="img" aria-label="KiCad PCB AI Skill R10 系统流程图"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071329"/><stop offset="0.65" stop-color="#0c2243"/><stop offset="1" stop-color="#041123"/></linearGradient><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#69cfff"/></marker><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#f4f9ff} .muted{fill:#aac0da}.head{font-size:36px;font-weight:750}.sub{font-size:17px;fill:#b2c8e7}.group{font-size:22px;font-weight:700}.step{font-size:18px;font-weight:700}.sm{font-size:15px}.tiny{font-size:13px}</style></defs><rect width="100%" height="100%" fill="url(#bg)"/><path d="M0 95 H1800" stroke="#2e658e" opacity=".5"/><path d="M25 1520 H1775" stroke="#2e658e" opacity=".4"/><text x="900" y="61" text-anchor="middle" class="head">R10 · 16节点逐项运行处理方法</text><text x="900" y="89" text-anchor="middle" class="sub">每节点都有输入、执行者、核验和失败回退；知识与工具验收可复用、项目结果必须重审</text><rect x="65" y="117" width="1665" height="68" rx="12" fill="#37b9ff" fill-opacity=".115" stroke="#37b9ff" stroke-opacity=".6"/><circle cx="112" cy="151" r="23" fill="#37b9ff"/><text x="112" y="158" text-anchor="middle" font-size="19" font-weight="800" fill="#081326">01</text><text x="163" y="157" font-size="21" font-weight="750">环境诊断</text><text x="432" y="157" font-size="18" class="muted">KiCad/CLI版本、Konnect连接、工程身份、独立候选</text><rect x="65" y="201" width="1665" height="68" rx="12" fill="#37b9ff" fill-opacity=".075" stroke="#37b9ff" stroke-opacity=".6"/><circle cx="112" cy="235" r="23" fill="#37b9ff"/><text x="112" y="242" text-anchor="middle" font-size="19" font-weight="800" fill="#081326">02</text><text x="163" y="241" font-size="21" font-weight="750">需求架构</text><text x="432" y="241" font-size="18" class="muted">功能、接口、电源/峰值电流、尺寸、验收矩阵</text><rect x="65" y="285" width="1665" height="68" rx="12" fill="#38e2ad" fill-opacity=".115" stroke="#38e2ad" stroke-opacity=".6"/><circle cx="112" cy="319" r="23" fill="#38e2ad"/><text x="112" y="326" text-anchor="middle" font-size="19" font-weight="800" fill="#081326">03</text><text x="163" y="325" font-size="21" font-weight="750">器件知识库</text><text x="432" y="325" font-size="18" class="muted">先查精确MPN/封装；命中复用；缺失才补资料</text><rect x="65" y="369" width="1665" height="68" rx="12" fill="#37b9ff" fill-opacity=".075" stroke="#37b9ff" stroke-opacity=".6"/><circle cx="112" cy="403" r="23" fill="#37b9ff"/><text x="112" y="410" text-anchor="middle" font-size="19" font-weight="800" fill="#081326">04</text><text x="163" y="409" font-size="21" font-weight="750">备选与DNP</text><text x="432" y="409" font-size="18" class="muted">0Ω、替代料、测试点、互斥变体、装配依据</text><rect x="65" y="453" width="1665" height="68" rx="12" fill="#38e2ad" fill-opacity=".115" stroke="#38e2ad" stroke-opacity=".6"/><circle cx="112" cy="487" r="23" fill="#38e2ad"/><text x="112" y="494" text-anchor="middle" font-size="19" font-weight="800" fill="#081326">05</text><text x="163" y="493" font-size="21" font-weight="750">原理图设计</text><text x="432" y="493" font-size="18" class="muted">先拓扑/网络，再布局和原生网表检查</text><rect x="65" y="537" width="1665" height="68" rx="12" fill="#38e2ad" fill-opacity=".075" stroke="#38e2ad" stroke-opacity=".6"/><circle cx="112" cy="571" r="23" fill="#38e2ad"/><text x="112" y="578" text-anchor="middle" font-size="19" font-weight="800" fill="#081326">06</text><text x="163" y="577" font-size="21" font-weight="750">G1电路评审</text><text x="432" y="577" font-size="18" class="muted">知识卡+原厂依据+ERC+AI分析+工程师确认</text><rect x="65" y="621" width="1665" height="68" rx="12" fill="#38e2ad" fill-opacity=".115" stroke="#38e2ad" stroke-opacity=".6"/><circle cx="112" cy="655" r="23" fill="#38e2ad"/><text x="112" y="662" text-anchor="middle" font-size="19" font-weight="800" fill="#081326">07</text><text x="163" y="661" font-size="21" font-weight="750">G2封装评审</text><text x="432" y="661" font-size="18" class="muted">Pin/Pad映射、EP/极性、封装资源锁</text><rect x="65" y="705" width="1665" height="68" rx="12" fill="#b49bff" fill-opacity=".075" stroke="#b49bff" stroke-opacity=".6"/><circle cx="112" cy="739" r="23" fill="#b49bff"/><text x="112" y="746" text-anchor="middle" font-size="19" font-weight="800" fill="#081326">08</text><text x="163" y="745" font-size="21" font-weight="750">规则/叠层</text><text x="432" y="745" font-size="18" class="muted">层栈、制造公差、NetClass、差分与原生规则回读</text><rect x="65" y="789" width="1665" height="68" rx="12" fill="#b49bff" fill-opacity=".115" stroke="#b49bff" stroke-opacity=".6"/><circle cx="112" cy="823" r="23" fill="#b49bff"/><text x="112" y="830" text-anchor="middle" font-size="19" font-weight="800" fill="#081326">09</text><text x="163" y="829" font-size="21" font-weight="750">G3布局评审</text><text x="432" y="829" font-size="18" class="muted">去耦、晶振、RF、器件焊盘距离与回流路径</text><rect x="65" y="873" width="1665" height="68" rx="12" fill="#b49bff" fill-opacity=".075" stroke="#b49bff" stroke-opacity=".6"/><circle cx="112" cy="907" r="23" fill="#b49bff"/><text x="112" y="914" text-anchor="middle" font-size="19" font-weight="800" fill="#081326">10</text><text x="163" y="913" font-size="21" font-weight="750">PCB布线</text><text x="432" y="913" font-size="18" class="muted">关键网络优先、分批Konnect写入、覆铜/重载/DRC</text><rect x="65" y="957" width="1665" height="68" rx="12" fill="#b49bff" fill-opacity=".115" stroke="#b49bff" stroke-opacity=".6"/><circle cx="112" cy="991" r="23" fill="#b49bff"/><text x="112" y="998" text-anchor="middle" font-size="19" font-weight="800" fill="#081326">11</text><text x="163" y="997" font-size="21" font-weight="750">G4最终PCB</text><text x="432" y="997" font-size="18" class="muted">全部铜层、关键网络、SI/PI边界与人工复审</text><rect x="65" y="1041" width="1665" height="68" rx="12" fill="#ffb45e" fill-opacity=".075" stroke="#ffb45e" stroke-opacity=".6"/><circle cx="112" cy="1075" r="23" fill="#ffb45e"/><text x="112" y="1082" text-anchor="middle" font-size="19" font-weight="800" fill="#081326">12</text><text x="163" y="1081" font-size="21" font-weight="750">DFX/NPI</text><text x="432" y="1081" font-size="18" class="muted">板厂工艺、装配/测试、BOM/CPL、风险闭环</text><rect x="65" y="1125" width="1665" height="68" rx="12" fill="#ffb45e" fill-opacity=".115" stroke="#ffb45e" stroke-opacity=".6"/><circle cx="112" cy="1159" r="23" fill="#ffb45e"/><text x="112" y="1166" text-anchor="middle" font-size="19" font-weight="800" fill="#081326">13</text><text x="163" y="1165" font-size="21" font-weight="750">冻结/制造候选</text><text x="432" y="1165" font-size="18" class="muted">Gerber/钻孔/BOM/CPL、SHA与版本一致性</text><rect x="65" y="1209" width="1665" height="68" rx="12" fill="#93a8ca" fill-opacity=".075" stroke="#93a8ca" stroke-opacity=".6"/><circle cx="112" cy="1243" r="23" fill="#93a8ca"/><text x="112" y="1250" text-anchor="middle" font-size="19" font-weight="800" fill="#081326">14</text><text x="163" y="1249" font-size="21" font-weight="750">外部CAM/EQ</text><text x="432" y="1249" font-size="18" class="muted">工厂CAM与EQ、正式生产授权（非AI自动）</text><rect x="65" y="1293" width="1665" height="68" rx="12" fill="#93a8ca" fill-opacity=".115" stroke="#93a8ca" stroke-opacity=".6"/><circle cx="112" cy="1327" r="23" fill="#93a8ca"/><text x="112" y="1334" text-anchor="middle" font-size="19" font-weight="800" fill="#081326">15</text><text x="163" y="1333" font-size="21" font-weight="750">外部样机验收</text><text x="432" y="1333" font-size="18" class="muted">实际装配、上电、性能/温升/EMC（非AI自动）</text><rect x="65" y="1377" width="1665" height="68" rx="12" fill="#93a8ca" fill-opacity=".075" stroke="#93a8ca" stroke-opacity=".6"/><circle cx="112" cy="1411" r="23" fill="#93a8ca"/><text x="112" y="1418" text-anchor="middle" font-size="19" font-weight="800" fill="#081326">16</text><text x="163" y="1417" font-size="21" font-weight="750">ECO与归档</text><text x="432" y="1417" font-size="18" class="muted">变更影响、受影响门禁复验、新旧版本证据</text><text x="900" y="1515" text-anchor="middle" class="sub">节点01–13：设计候选 → 待审核资料；节点14–16：外部授权/真实测试/变更管理</text></svg>